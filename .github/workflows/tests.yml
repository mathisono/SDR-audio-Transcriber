name: Speech-first regression tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Dependency-free runtime, synthetic CW and mocked-ASR tests
        run: python -m unittest discover -s tests -v
      - name: Check shell syntax
        run: bash -n install.sh scripts/start_rtl_fm_receiver.sh
  asr-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install pinned ASR baseline
        run: python -m pip install -r requirements.txt
      - name: Generate known speech (not an RF recording)
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak
          mkdir -p test-results
          printf '%s\n' 'This is a radio audio transcription test. The receiver is monitoring a local channel. Keep the original recording.' > test-results/reference.txt
          espeak -s 140 -f test-results/reference.txt -w test-results/reference.wav
      - name: Run real small.en CPU INT8 smoke check
        run: |
          python scripts/verify_asr.py --wav test-results/reference.wav \
            --reference-file test-results/reference.txt --output test-results/asr.json \
            --model small.en --device cpu --compute-type int8 --max-wer 0.35
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-asr-smoke-results
          path: test-results/
